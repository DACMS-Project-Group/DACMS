services:
  - type: web
    name: dacms-web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: dacms-documents
      mountPath: /app/backend/documents
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dacms-db
          property: connectionString

databases:
  - name: dacms-db
    databaseName: app_db
    user: dacms_user
    plan: basic-256mb
    region: oregon
