<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AACMS Notification</title>
</head>
<body style="margin:0; padding:0; background:#f5f5f7; font-family:Inter, Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f7; padding:40px 0;">
    <tr>
      <td align="center">

        <table width="600" cellpadding="0" cellspacing="0"
               style="background:#ffffff; border-radius:12px; overflow:hidden;">

          <!-- NWU HEADER -->
          <tr>
            <td style="padding:24px 32px; border-bottom:1px solid #eee;">
              <img src="cid:NWU-Logo"
                   alt="NWU Logo" height="48" style="display:block;" />
            </td>
          </tr>

          <!-- AACMS NOTIFICATIONS SUBHEADER -->
          <tr>
            <td style="background:#4B2E83; padding:16px 32px;">
              <h2 style="color:#ffffff; font-size:16px; font-weight:600;
                         margin:0; letter-spacing:0.5px;">
                AACMS Notifications
              </h2>
            </td>
          </tr>

          <!-- BODY -->
          <tr>
            <td style="padding:32px;">

              <p style="font-size:16px; color:#1a1a1a; margin:0 0 16px;">
                Dear {{title}} {{name}},
              </p>

              <p style="font-size:15px; line-height:1.6; color:#333;
                        margin:0 0 24px; white-space:pre-line;">
                {{message}}
              </p>

              <p style="font-size:15px; color:#333; margin:24px 0 0;">
                Kind regards,<br />
                <strong>{{sender}}</strong> via <em>AACMS Notifications</em>
              </p>

            </td>
          </tr>

          <!-- AACMS FOOTER -->
          <tr>
            <td style="padding:20px 32px; background:#fafafa; text-align:center;
                       border-top:1px solid #eee;">
              <p style="font-size:12px; color:#888; margin:0;">
                © 2026 North-West University • AACMS
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
